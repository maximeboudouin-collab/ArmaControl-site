<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArmaControl</title>

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      height: 100vh;
      text-align: center;
      position: relative;
    }

    img {
      width: 65%;
      max-width: 320px;
      margin-bottom: 25px;
    }

    p {
      font-size: 20px;
      opacity: 0.8;
      letter-spacing: 1px;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      color: #777;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <img src="logo.png" alt="Logo ArmaControl">

  <p>En construction</p>

  <footer>
    Powered by AMCTL
  </footer>

</body>
</html>
